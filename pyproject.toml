[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtcipy"
version = "0.1.0"
description = "Python port of TensorCrossInterpolation.jl and QuanticsGrids.jl"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7", "scipy>=1.10"]
fast = ["numba>=0.58"]

[tool.setuptools.packages.find]
include = ["qtcipy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
